name: Preview build

# Builds this branch and publishes it to gh-pages under /preview/manual-tables/,
# leaving the production site at the root untouched.
# URL: https://victoralbenor.github.io/commander-randomizer/preview/manual-tables/

on:
  push:
    branches: [manual-tables-session-history]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-manual-tables
  cancel-in-progress: true

env:
  PREVIEW_PATH: preview/manual-tables

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
                      VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` fails on Linux: package-lock.json lacks @emnapi/core and
      # @emnapi/runtime (needed by Vite 8's wasm fallback binding). `npm install`
      # resolves them in CI without modifying the committed lockfile.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build -- --base=/commander-randomizer/${{ env.PREVIEW_PATH }}/

      - name: Deploy to gh-pages subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ env.PREVIEW_PATH }}
          commit_message: "Preview: ${{ github.sha }}"
